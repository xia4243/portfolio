<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 ｜ ページが見つかりません ｜ 夏目崎子 ポートフォリオ</title>
  <meta name="description" content="お探しのページは見つかりませんでした。URL が変更されたか、削除された可能性があります。" />
  <meta name="theme-color" content="#f7f4ee" />
  <meta name="robots" content="noindex" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316130f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23df4d2f'/%3E%3C/svg%3E" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    .nf {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: var(--section-y) var(--gutter);
    }
    .nf__inner { max-width: 52ch; }
    .nf__code {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: clamp(5rem, 3rem + 18vw, 13rem);
      line-height: 0.9;
      letter-spacing: -0.02em;
      color: var(--c-ink);
    }
    .nf__code em { color: var(--c-accent); font-style: normal; }
    .nf h1 { font-size: var(--fs-h2); margin-top: var(--sp-4); }
    .nf p { font-size: var(--fs-lead); color: var(--c-ink-2); margin-top: var(--sp-4); }
    .nf__cta { display: flex; flex-wrap: wrap; gap: var(--sp-3); justify-content: center; margin-top: var(--sp-7); }
  </style>
</head>

<body>
  <main class="nf">
    <div class="nf__inner">
      <a class="brand u-mx-auto reveal" href="./index.html" aria-label="ホーム" style="display:inline-flex">
        <span class="brand__mark">N</span>
        <span>NATSUME<span class="u-accent">.</span></span>
      </a>
      <p class="nf__code reveal" data-delay="1" aria-hidden="true">4<em>0</em>4</p>
      <h1 class="reveal" data-delay="2">ページが見つかりません</h1>
      <p class="reveal" data-delay="2">
        お探しのページは移動または削除された可能性があります。
        URL をご確認のうえ、トップページからお進みください。
      </p>
      <div class="nf__cta reveal" data-delay="3">
        <a href="./index.html" class="btn btn--accent btn--lg">トップへ戻る <span class="arrow">→</span></a>
        <a href="./index.html#contact" class="btn btn--ghost btn--lg">お問い合わせ</a>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
